<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ghi nhớ bài tập của A3 - By anh kiệt</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
            position: relative;
            overflow-x: hidden;
        }

        .background-canvas {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
            pointer-events: none;
        }

        .anime-girl {
            position: fixed;
            bottom: -50px;
            right: -100px;
            width: 500px;
            height: 600px;
            z-index: 2;
            opacity: 0.15;
            filter: blur(8px);
            pointer-events: none;
            animation: float 6s ease-in-out infinite;
        }

        @keyframes float {
            0%, 100% {
                transform: translateY(0px) translateX(0px);
            }
            50% {
                transform: translateY(-20px) translateX(-10px);
            }
        }

        .bokeh {
            position: fixed;
            border-radius: 50%;
            filter: blur(40px);
            opacity: 0.4;
            pointer-events: none;
            animation: bokeh-float linear infinite;
        }

        @keyframes bokeh-float {
            0% {
                transform: translateY(100vh) translateX(0);
            }
            100% {
                transform: translateY(-100vh) translateX(100px);
            }
        }

        .flower {
            position: fixed;
            font-size: 40px;
            filter: blur(2px);
            opacity: 0.6;
            pointer-events: none;
            animation: flower-fall linear infinite;
        }

        @keyframes flower-fall {
            0% {
                transform: translateY(-100px) rotateZ(0deg);
                opacity: 0.8;
            }
            100% {
                transform: translateY(100vh) rotateZ(360deg);
                opacity: 0;
            }
        }

        .container {
            position: relative;
            z-index: 10;
            max-width: 1200px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            overflow: hidden;
        }

        header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 2.5em;
            margin-bottom: 10px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        header .subtitle {
            font-size: 1.2em;
            opacity: 0.9;
        }

        .date-selector {
            padding: 30px 20px;
            background: #f8f9fa;
            border-bottom: 2px solid #e0e0e0;
            display: flex;
            align-items: center;
            gap: 15px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .date-selector label {
            font-weight: 600;
            color: #333;
            font-size: 1.1em;
        }

        .date-selector input {
            padding: 12px 15px;
            border: 2px solid #667eea;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .date-selector input:hover {
            box-shadow: 0 0 10px rgba(102, 126, 234, 0.3);
        }

        .day-of-week {
            background: #667eea;
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-weight: 600;
            min-width: 120px;
            text-align: center;
            font-size: 1.1em;
        }

        .tasks-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            padding: 30px 20px;
            min-height: 300px;
        }

        .section {
            background: #f8f9fa;
            border-radius: 15px;
            padding: 25px;
            border-left: 5px solid #667eea;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            transition: all 0.3s ease;
        }

        .section:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 25px rgba(0, 0, 0, 0.15);
        }

        .section-su-kien {
            border-left-color: #f59e0b;
        }

        .section-bai-hoc {
            border-left-color: #667eea;
        }

        .section-kiem-tra {
            border-left-color: #ef4444;
        }

        .section h2 {
            margin-bottom: 20px;
            color: #333;
            font-size: 1.5em;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .task-list {
            list-style: none;
        }

        .task-item {
            background: white;
            padding: 15px;
            margin-bottom: 10px;
            border-radius: 10px;
            border-left: 4px solid #667eea;
            transition: all 0.3s ease;
            word-wrap: break-word;
        }

        .task-item:hover {
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
            transform: translateX(5px);
        }

        .section-su-kien .task-item {
            border-left-color: #f59e0b;
        }

        .section-bai-hoc .task-item {
            border-left-color: #667eea;
        }

        .section-kiem-tra .task-item {
            border-left-color: #ef4444;
        }

        .empty-message {
            color: #999;
            font-style: italic;
            text-align: center;
            padding: 30px 20px;
            font-size: 1.1em;
        }

        .ai-section {
            background: #f0f4ff;
            border-radius: 12px;
            padding: 25px;
            border: 2px solid #667eea;
            margin: 20px;
        }

        .ai-section h3 {
            color: #667eea;
            margin-bottom: 15px;
            font-size: 1.3em;
        }

        .ai-section textarea {
            width: 100%;
            padding: 15px;
            border: 2px solid #667eea;
            border-radius: 10px;
            font-family: 'Segoe UI', sans-serif;
            font-size: 1em;
            resize: vertical;
            min-height: 100px;
            margin-bottom: 10px;
        }

        .ai-section button {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 8px;
            font-size: 1em;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.3s ease;
        }

        .ai-section button:hover {
            transform: scale(1.05);
            box-shadow: 0 8px 20px rgba(102, 126, 234, 0.3);
        }

        .ai-response-box {
            background: white;
            padding: 20px;
            margin-top: 15px;
            border-radius: 10px;
            border-left: 4px solid #10b981;
            display: none;
            min-height: 60px;
            line-height: 1.6;
            color: #333;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .ai-response-box.active {
            display: block;
            animation: slideDown 0.3s ease;
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-10px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .tasks-container {
                grid-template-columns: 1fr;
            }

            .date-selector {
                flex-direction: column;
                align-items: stretch;
            }

            .date-selector input,
            .day-of-week {
                width: 100%;
            }

            .anime-girl {
                width: 300px;
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <canvas class="background-canvas" id="backgroundCanvas"></canvas>
    
    <!-- Anime Girl SVG -->
    <svg class="anime-girl" viewBox="0 0 200 300" xmlns="http://www.w3.org/2000/svg">
        <!-- Đầu -->
        <circle cx="100" cy="80" r="35" fill="#f5d5b8" opacity="0.8"/>
        
        <!-- Tóc -->
        <path d="M 65 80 Q 65 45 100 40 Q 135 45 135 80" fill="#ff69b4" opacity="0.7"/>
        <path d="M 70 70 Q 100 35 130 70" fill="#ff1493" opacity="0.6"/>
        
        <!-- Mắt -->
        <circle cx="90" cy="75" r="6" fill="#1a1a1a" opacity="0.7"/>
        <circle cx="110" cy="75" r="6" fill="#1a1a1a" opacity="0.7"/>
        <circle cx="92" cy="73" r="2" fill="white" opacity="0.8"/>
        <circle cx="112" cy="73" r="2" fill="white" opacity="0.8"/>
        
        <!-- Mũi -->
        <line x1="100" y1="80" x2="100" y2="88" stroke="#d4a5a0" stroke-width="1" opacity="0.6"/>
        
        <!-- Miệng -->
        <path d="M 95 95 Q 100 100 105 95" stroke="#ff6b9d" stroke-width="1.5" fill="none" opacity="0.7"/>
        
        <!-- Cơ thể -->
        <rect x="75" y="115" width="50" height="60" rx="10" fill="#e8b4d0" opacity="0.7"/>
        
        <!-- Tay -->
        <ellipse cx="60" cy="130" rx="12" ry="30" fill="#f5d5b8" opacity="0.7" transform="rotate(-30 60 130)"/>
        <ellipse cx="140" cy="130" rx="12" ry="30" fill="#f5d5b8" opacity="0.7" transform="rotate(30 140 130)"/>
        
        <!-- Chân -->
        <line x1="85" y1="175" x2="85" y2="230" stroke="#f5d5b8" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
        <line x1="115" y1="175" x2="115" y2="230" stroke="#f5d5b8" stroke-width="10" stroke-linecap="round" opacity="0.7"/>
        
        <!-- Halo (vòng sáng) -->
        <circle cx="100" cy="50" r="40" fill="none" stroke="#ffff99" stroke-width="2" opacity="0.5" stroke-dasharray="5,5"/>
    </svg>

    <div class="container">
        <header>
            <h1>📚 Ghi nhớ bài tập của A3</h1>
            <p class="subtitle">By anh kiệt</p>
        </header>

        <div class="date-selector">
            <label for="datePicker">📅 Chọn ngày:</label>
            <input type="date" id="datePicker">
            <span id="dayOfWeek" class="day-of-week"></span>
        </div>

        <div class="tasks-container">
            <div class="section section-su-kien">
                <h2>🎉 Sự Kiện</h2>
                <ul id="suKien" class="task-list"></ul>
            </div>

            <div class="section section-bai-hoc">
                <h2>📖 Bài Học</h2>
                <ul id="baiHoc" class="task-list"></ul>
            </div>

            <div class="section section-kiem-tra">
                <h2>📝 Kiểm Tra</h2>
                <ul id="kiemTra" class="task-list"></ul>
            </div>
        </div>

        <div class="ai-section">
            <h3>🤖 AI Hỗ Trợ Giải Bài</h3>
            <textarea id="aiQuestion" placeholder="Nhập câu hỏi bài tập của bạn..."></textarea>
            <button onclick="askAI()">🎯 Hỏi AI</button>
            <div id="aiResponse" class="ai-response-box"></div>
        </div>
    </div>

    <script>
        const days = ['Chủ Nhật', 'Thứ Hai', 'Thứ Ba', 'Thứ Tư', 'Thứ Năm', 'Thứ Sáu', 'Thứ Bảy'];

        // Dữ liệu mẫu
        const sampleData = {
            "2024-12-16": {
                suKien: ["Cuộc họp lớp lúc 2:00 PM"],
                baiHoc: ["Toán - Bài 5: Phân số", "Tiếng Anh - Unit 3"],
                kiemTra: []
            },
            "2024-12-17": {
                suKien: [],
                baiHoc: ["Vật Lý - Chương 2", "Hóa Học - Ôn tập"],
                kiemTra: ["Kiểm tra Toán lúc 9:00 AM"]
            },
            "2024-12-18": {
                suKien: ["Ngày kỉ niệm thành lập"],
                baiHoc: [],
                kiemTra: ["Kiểm tra Tiếng Anh"]
            }
        };

        // Tạo nền động
        function createAnimatedBackground() {
            const canvas = document.getElementById('backgroundCanvas');
            const ctx = canvas.getContext('2d');
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;

            const particles = [];
            const flowers = ['🌸', '🌼', '🌷', '🌹', '💐', '✨'];

            // Tạo bokeh
            for (let i = 0; i < 15; i++) {
                const bokeh = document.createElement('div');
                bokeh.className = 'bokeh';
                const size = Math.random() * 150 + 50;
                const color = ['rgba(255, 105, 180, 0.5)', 'rgba(255, 182, 193, 0.5)', 'rgba(255, 255, 200, 0.5)', 'rgba(200, 150, 255, 0.5)'][Math.floor(Math.random() * 4)];
                bokeh.style.width = size + 'px';
                bokeh.style.height = size + 'px';
                bokeh.style.left = Math.random() * 100 + '%';
                bokeh.style.top = Math.random() * 100 + '%';
                bokeh.style.background = color;
                bokeh.style.animationDuration = (Math.random() * 10 + 8) + 's';
                bokeh.style.animationDelay = Math.random() * 5 + 's';
                document.body.appendChild(bokeh);
            }

            // Tạo hoa rơi
            setInterval(() => {
                const flower = document.createElement('div');
                flower.className = 'flower';
                flower.textContent = flowers[Math.floor(Math.random() * flowers.length)];
                flower.style.left = Math.random() * 100 + 'vw';
                flower.style.animationDuration = (Math.random() * 10 + 8) + 's';
                flower.style.animationDelay = '0s';
                document.body.appendChild(flower);

                setTimeout(() => flower.remove(), 15000);
            }, 500);
        }

        // Set today as default date
        window.addEventListener('DOMContentLoaded', () => {
            createAnimatedBackground();
            
            const today = new Date().toISOString().split('T')[0];
            document.getElementById('datePicker').value = today;
            updateDayOfWeek();
            loadTasks();
        });

        // Update day of week when date changes
        document.getElementById('datePicker').addEventListener('change', () => {
            updateDayOfWeek();
            loadTasks();
        });

        function updateDayOfWeek() {
            const datePicker = document.getElementById('datePicker');
            const date = new Date(datePicker.value + 'T00:00:00');
            const dayName = days[date.getDay()];
            document.getElementById('dayOfWeek').textContent = dayName;
        }

        function loadTasks() {
            const selectedDate = document.getElementById('datePicker').value;
            const allTasks = JSON.parse(localStorage.getItem('allTasks')) || sampleData;
            const tasksForDate = allTasks[selectedDate] || { suKien: [], baiHoc: [], kiemTra: [] };

            // Load Sự Kiện
            const suKienList = document.getElementById('suKien');
            suKienList.innerHTML = '';
            if (tasksForDate.suKien && tasksForDate.suKien.length > 0) {
                tasksForDate.suKien.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.textContent = task;
                    suKienList.appendChild(li);
                });
            } else {
                suKienList.innerHTML = '<li class="empty-message">Không có sự kiện</li>';
            }

            // Load Bài Học
            const baiHocList = document.getElementById('baiHoc');
            baiHocList.innerHTML = '';
            if (tasksForDate.baiHoc && tasksForDate.baiHoc.length > 0) {
                tasksForDate.baiHoc.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.textContent = task;
                    baiHocList.appendChild(li);
                });
            } else {
                baiHocList.innerHTML = '<li class="empty-message">Không có bài học</li>';
            }

            // Load Kiểm Tra
            const kiemTraList = document.getElementById('kiemTra');
            kiemTraList.innerHTML = '';
            if (tasksForDate.kiemTra && tasksForDate.kiemTra.length > 0) {
                tasksForDate.kiemTra.forEach(task => {
                    const li = document.createElement('li');
                    li.className = 'task-item';
                    li.textContent = task;
                    kiemTraList.appendChild(li);
                });
            } else {
                kiemTraList.innerHTML = '<li class="empty-message">Không có kiểm tra</li>';
            }
        }

        function askAI() {
            const question = document.getElementById('aiQuestion').value.trim();
            const responseDiv = document.getElementById('aiResponse');

            if (!question) {
                alert('Vui lòng nhập câu hỏi!');
                return;
            }

            responseDiv.innerHTML = '🤔 Đang xử lý...';
            responseDiv.classList.add('active');

            setTimeout(() => {
                responseDiv.innerHTML = generateAIResponse(question);
            }, 800);
        }

        function generateAIResponse(question) {
            const responses = [
                `📖 Câu hỏi: "${question}"\n\n💡 Gợi ý:\nHãy xem lại bài học trong sách giáo khoa. Tìm kiếm từ khóa liên quan đến câu hỏi của bạn.\n\n🎯 Cách tiếp cận:\n1. Đọc kỹ đề bài\n2. Xác định dạng bài tập\n3. Áp dụng công thức hoặc quy tắc phù hợp\n4. Kiểm tra lại đáp án`,
                `⭐ Bạn đặt câu hỏi hay!\n\n🔍 Để giải quyết:\n- Xác định thông tin đã cho\n- Liệt kê công thức cần dùng\n- Thực hiện từng bước tính toán\n- So sánh với lý thuyết\n\n💪 Hãy cố gắng làm trước, nếu khó khăn hãy hỏi thầy cô!`,
                `✨ Đây là một câu hỏi thú vị!\n\n📚 Hướng dẫn:\n1. Ôn lại bài học trước đó\n2. Hiểu rõ định nghĩa cơ bản\n3. Thực hành với các ví dụ\n4. Giải bài tập tương tự\n\n🌟 Khi nào không hiểu, đừng ngần ngại hỏi!`
            ];
            return responses[Math.floor(Math.random() * responses.length)];
        }
    </script>
</body>
</html>
