<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Clock - Multiple Time Zones</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier New', monospace;
            background: linear-gradient(135deg, #1e3c72 0%, #2a5298 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(0, 0, 0, 0.8);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
            max-width: 900px;
            width: 100%;
        }

        header {
            text-align: center;
            margin-bottom: 40px;
        }

        header h1 {
            color: #00ff88;
            font-size: 2.5em;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 10px;
        }

        header p {
            color: #888;
            font-size: 0.9em;
        }

        .clocks-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .clock-card {
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 20px;
            text-align: center;
            box-shadow: 0 0 20px rgba(0, 255, 136, 0.2);
            transition: all 0.3s ease;
        }

        .clock-card:hover {
            box-shadow: 0 0 30px rgba(0, 255, 136, 0.4);
            transform: translateY(-5px);
        }

        .timezone-label {
            color: #00ff88;
            font-size: 0.9em;
            margin-bottom: 10px;
            font-weight: bold;
            text-transform: uppercase;
        }

        .time-display {
            font-size: 2.5em;
            color: #00ff88;
            text-shadow: 0 0 10px #00ff88;
            margin-bottom: 10px;
            font-weight: bold;
            letter-spacing: 2px;
        }

        .date-display {
            color: #888;
            font-size: 0.85em;
            margin-bottom: 10px;
        }

        .day-display {
            color: #00ff88;
            font-size: 0.8em;
            opacity: 0.8;
        }

        .controls {
            background: linear-gradient(145deg, #1a1a1a, #2d2d2d);
            border: 2px solid #00ff88;
            border-radius: 15px;
            padding: 20px;
            margin-bottom: 20px;
        }

        .controls h3 {
            color: #00ff88;
            margin-bottom: 15px;
            text-transform: uppercase;
            font-size: 0.9em;
        }

        .control-buttons {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            justify-content: center;
        }

        .btn {
            background: #00ff88;
            color: #000;
            border: none;
            padding: 10px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
            font-family: 'Courier New', monospace;
        }

        .btn:hover {
            background: #00dd6f;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
            transform: scale(1.05);
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn.remove {
            background: #ff4444;
            color: white;
        }

        .btn.remove:hover {
            background: #cc0000;
            box-shadow: 0 0 15px rgba(255, 68, 68, 0.5);
        }

        .timezone-select {
            padding: 10px 15px;
            border: 2px solid #00ff88;
            background: #1a1a1a;
            color: #00ff88;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        .timezone-select:hover {
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        .timezone-select:focus {
            outline: none;
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.5);
        }

        .format-toggle {
            display: flex;
            gap: 10px;
            justify-content: center;
            margin-top: 15px;
        }

        .format-btn {
            padding: 8px 16px;
            background: #1a1a1a;
            color: #00ff88;
            border: 2px solid #00ff88;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }

        .format-btn.active {
            background: #00ff88;
            color: #000;
        }

        .format-btn:hover {
            box-shadow: 0 0 10px rgba(0, 255, 136, 0.3);
        }

        footer {
            text-align: center;
            color: #888;
            font-size: 0.85em;
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px solid #00ff88;
        }

        @media (max-width: 768px) {
            header h1 {
                font-size: 1.8em;
            }

            .time-display {
                font-size: 2em;
            }

            .clocks-grid {
                grid-template-columns: 1fr;
            }
        }

        .blink {
            animation: blink 1s infinite;
        }

        @keyframes blink {
            0%, 49% { opacity: 1; }
            50%, 100% { opacity: 0.3; }
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1>⏰ Digital Clock</h1>
            <p>Multiple Time Zones Display</p>
        </header>

        <div class="controls">
            <h3>⚙️ Controls</h3>
            <div class="control-buttons">
                <select id="timezoneSelect" class="timezone-select">
                    <option value="">-- Select Timezone --</option>
                    <option value="America/New_York">🗽 New York (EST/EDT)</option>
                    <option value="America/Chicago">🌆 Chicago (CST/CDT)</option>
                    <option value="America/Denver">🏔️ Denver (MST/MDT)</option>
                    <option value="America/Los_Angeles">🌴 Los Angeles (PST/PDT)</option>
                    <option value="America/Anchorage">❄️ Anchorage (AKST/AKDT)</option>
                    <option value="Pacific/Honolulu">🌺 Honolulu (HST)</option>
                    <option value="Europe/London">🇬🇧 London (GMT/BST)</option>
                    <option value="Europe/Paris">🇫🇷 Paris (CET/CEST)</option>
                    <option value="Europe/Berlin">🇩🇪 Berlin (CET/CEST)</option>
                    <option value="Europe/Moscow">🇷🇺 Moscow (MSK)</option>
                    <option value="Asia/Dubai">🇦🇪 Dubai (GST)</option>
                    <option value="Asia/Kolkata">🇮🇳 India (IST)</option>
                    <option value="Asia/Bangkok">🇹🇭 Bangkok (ICT)</option>
                    <option value="Asia/Singapore">🇸🇬 Singapore (SGT)</option>
                    <option value="Asia/Hong_Kong">🇭🇰 Hong Kong (HKT)</option>
                    <option value="Asia/Tokyo">🇯🇵 Tokyo (JST)</option>
                    <option value="Asia/Seoul">🇰🇷 Seoul (KST)</option>
                    <option value="Australia/Sydney">🇦🇺 Sydney (AEDT/AEST)</option>
                    <option value="Pacific/Auckland">🇳🇿 Auckland (NZDT/NZST)</option>
                    <option value="Asia/Ho_Chi_Minh">🇻🇳 Ho Chi Minh (ICT)</option>
                </select>
                <button class="btn" onclick="addTimezone()">+ Add Timezone</button>
            </div>
            <div class="format-toggle">
                <button class="format-btn active" onclick="setFormat('24')">24 Hour</button>
                <button class="format-btn" onclick="setFormat('12')">12 Hour</button>
            </div>
        </div>

        <div id="clocksContainer" class="clocks-grid"></div>

        <footer>
            <p>Real-time clock with automatic daylight saving time adjustment</p>
        </footer>
    </div>

    <script>
        let timeFormat = '24'; // 24 or 12
        let timezones = ['UTC', 'America/New_York', 'Europe/London', 'Asia/Tokyo'];

        // Load from localStorage
        function loadTimezones() {
            const saved = localStorage.getItem('timezones');
            if (saved) {
                timezones = JSON.parse(saved);
            }
            renderClocks();
        }

        // Save to localStorage
        function saveTimezones() {
            localStorage.setItem('timezones', JSON.stringify(timezones));
        }

        function addTimezone() {
            const select = document.getElementById('timezoneSelect');
            const timezone = select.value;

            if (!timezone) {
                alert('Please select a timezone');
                return;
            }

            if (!timezones.includes(timezone)) {
                timezones.push(timezone);
                saveTimezones();
                renderClocks();
            }

            select.value = '';
        }

        function removeTimezone(timezone) {
            timezones = timezones.filter(tz => tz !== timezone);
            saveTimezones();
            renderClocks();
        }

        function setFormat(format) {
            timeFormat = format;
            document.querySelectorAll('.format-btn').forEach(btn => {
                btn.classList.remove('active');
            });
            event.target.classList.add('active');
            updateClocks();
        }

        function getTimezoneLabel(timezone) {
            const labels = {
                'UTC': '🌍 UTC',
                'America/New_York': '🗽 New York',
                'America/Chicago': '🌆 Chicago',
                'America/Denver': '🏔️ Denver',
                'America/Los_Angeles': '🌴 Los Angeles',
                'America/Anchorage': '❄️ Anchorage',
                'Pacific/Honolulu': '🌺 Honolulu',
                'Europe/London': '🇬🇧 London',
                'Europe/Paris': '🇫🇷 Paris',
                'Europe/Berlin': '🇩🇪 Berlin',
                'Europe/Moscow': '🇷🇺 Moscow',
                'Asia/Dubai': '🇦🇪 Dubai',
                'Asia/Kolkata': '🇮🇳 India',
                'Asia/Bangkok': '🇹🇭 Bangkok',
                'Asia/Singapore': '🇸🇬 Singapore',
                'Asia/Hong_Kong': '🇭🇰 Hong Kong',
                'Asia/Tokyo': '🇯🇵 Tokyo',
                'Asia/Seoul': '🇰🇷 Seoul',
                'Australia/Sydney': '🇦🇺 Sydney',
                'Pacific/Auckland': '🇳🇿 Auckland',
                'Asia/Ho_Chi_Minh': '🇻🇳 Ho Chi Minh'
            };
            return labels[timezone] || timezone;
        }

        function getTimeInTimezone(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: timeFormat === '12'
            });
            return formatter.format(now);
        }

        function getDateInTimezone(timezone) {
            const now = new Date();
            const formatter = new Intl.DateTimeFormat('en-US', {
                timeZone: timezone,
                weekday: 'short',
                year: 'numeric',
                month: 'short',
                day: 'numeric'
            });
            return formatter.format(now);
        }

        function renderClocks() {
            const container = document.getElementById('clocksContainer');
            container.innerHTML = '';

            timezones.forEach(timezone => {
                const card = document.createElement('div');
                card.className = 'clock-card';
                card.innerHTML = `
                    <div class="timezone-label">${getTimezoneLabel(timezone)}</div>
                    <div class="time-display" id="time-${timezone}"></div>
                    <div class="date-display" id="date-${timezone}"></div>
                    <div class="day-display" id="day-${timezone}"></div>
                    ${timezone !== 'UTC' ? `<button class="btn remove" onclick="removeTimezone('${timezone}')">Remove</button>` : ''}
                `;
                container.appendChild(card);
            });

            updateClocks();
        }

        function updateClocks() {
            timezones.forEach(timezone => {
                const timeEl = document.getElementById(`time-${timezone}`);
                const dateEl = document.getElementById(`date-${timezone}`);
                const dayEl = document.getElementById(`day-${timezone}`);

                if (timeEl) {
                    timeEl.textContent = getTimeInTimezone(timezone);
                    dateEl.textContent = getDateInTimezone(timezone);
                    
                    const now = new Date();
                    const options = { timeZone: timezone, hour: '2-digit', minute: '2-digit' };
                    const isDaytime = new Date().getHours() >= 6 && new Date().getHours() < 18;
                    dayEl.textContent = isDaytime ? '☀️ Daytime' : '🌙 Nighttime';
                }
            });
        }

        // Update every second
        setInterval(updateClocks, 1000);

        // Initial load
        loadTimezones();
    </script>
</body>
</html>
